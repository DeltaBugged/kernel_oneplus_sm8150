name: Plain DerpFest 17 hotdogb build

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu-ultra

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out DerpFest 17 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install build dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential cpio curl libssl-dev libelf-dev python3 zip clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi device-tree-compiler

      - name: Link LLVM 14 tool names expected by this kernel
        run: |
          set -euo pipefail
          for tool in ar nm objcopy objdump strip; do
            ln -sf "$(command -v llvm-${tool}-14)" "/usr/local/bin/llvm-${tool}"
          done

      - name: Integrate SukiSU Ultra builtin
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Nova/SukiSU-Nova/4bec532dd447e2852aa8932afa768255350c103a/kernel/setup.sh" | bash -s 4bec532dd447e2852aa8932afa768255350c103a
          test -L drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          # Linux 4.14 has no static_call.h; this header is included unconditionally
          # by this SukiSU revision but its static-call API is not used on this target.
          sed -i '/^#include <linux\/static_call\.h>$/d' KernelSU/kernel/kernel_includes.h
          if grep -Fq 'linux/static_call.h' KernelSU/kernel/kernel_includes.h; then
            echo "ERROR: Linux 4.14 static_call include remains"
            exit 1
          fi
          echo "Applied Linux 4.14 SukiSU compatibility adjustment"

      - name: Patch SukiSU KPM for Linux 4.14
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          sched_path = Path("include/linux/sched.h")
          kpm_path = Path("drivers/kernelsu/extension/kpm/kpm.c")
          super_path = Path("drivers/kernelsu/extension/kpm/super_access.c")

          # Confirm the Linux 4.14 task_struct layout before patching.
          sched = sched_path.read_text()
          match = re.search(r"struct task_struct\s*\{(.*?)\n\};", sched, re.S)
          if not match:
              raise SystemExit("ERROR: struct task_struct not found in include/linux/sched.h")
          task_struct = match.group(1)
          if not re.search(r"\bstruct\s+pid\s*\*\s*thread_pid\s*;", task_struct):
              raise SystemExit("ERROR: task_struct.thread_pid is missing")
          if re.search(r"\bpids\s*\[", task_struct):
              raise SystemExit("ERROR: task_struct unexpectedly contains pids[]")

          # result_code is copied to userspace, so this access must be VERIFY_WRITE.
          kpm = kpm_path.read_text()
          access_pattern = re.compile(
              r"access_ok\(\s*u64_to_user_ptr\(cmd\.result_code\)\s*,\s*sizeof\(result\)\s*\)"
          )
          kpm, access_count = access_pattern.subn(
              "access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))",
              kpm,
          )
          if access_count == 0:
              if not re.search(
                  r"access_ok\(\s*VERIFY_WRITE\s*,\s*u64_to_user_ptr\(cmd\.result_code\)\s*,\s*sizeof\(result\)\s*\)",
                  kpm,
              ):
                  raise SystemExit("ERROR: expected result_code access_ok() call was not found")
          elif access_count != 1:
              raise SystemExit(f"ERROR: patched {access_count} result_code access_ok() calls; expected one")
          kpm_path.write_text(kpm)

          # Replace the obsolete pids[] member metadata with the Linux 4.14 thread_pid field.
          super_access = super_path.read_text()
          member_pattern = re.compile(
              r"(?m)^#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(4,\s*19,\s*0\)\s*\n"
              r"\s*DEFINE_MEMBER\(task_struct,\s*pids\[PIDTYPE_PID\]\.pid\)\s*\n"
              r"#else\s*\n"
              r"\s*DEFINE_MEMBER\(task_struct,\s*thread_pid\)\s*\n"
              r"#endif"
          )
          replacement = (
              "/* Linux 4.14 stores the struct pid pointer in task_struct.thread_pid. */\n"
              "DEFINE_MEMBER(task_struct, thread_pid)"
          )
          super_access, member_count = member_pattern.subn(replacement, super_access)
          if member_count == 0:
              if "DEFINE_MEMBER(task_struct, thread_pid)" not in super_access:
                  raise SystemExit("ERROR: obsolete task_struct pids[] block not found")
              if "DEFINE_MEMBER(task_struct, pids[PIDTYPE_PID].pid)" in super_access:
                  raise SystemExit("ERROR: obsolete task_struct pids[] metadata remains")
          elif member_count != 1:
              raise SystemExit(f"ERROR: replaced {member_count} task_struct member blocks; expected one")
          super_path.write_text(super_access)

          # Fail before compilation if either old API is still present.
          patched_kpm = kpm_path.read_text()
          patched_super = super_path.read_text()
          if re.search(r"access_ok\(\s*u64_to_user_ptr\(cmd\.result_code\)", patched_kpm):
              raise SystemExit("ERROR: 2-argument access_ok() call remains")
          if "DEFINE_MEMBER(task_struct, pids[PIDTYPE_PID].pid)" in patched_super:
              raise SystemExit("ERROR: obsolete task_struct.pids[] metadata remains")
          if "DEFINE_MEMBER(task_struct, thread_pid)" not in patched_super:
              raise SystemExit("ERROR: task_struct.thread_pid metadata was not installed")

          print("Applied and verified Linux 4.14 SukiSU KPM compatibility patches")
          PY

      - name: Generate kernel configuration
        run: |
          set -euo pipefail
          make ARCH=arm64 O=out vendor/sm8150-perf_defconfig

      - name: Merge OPlus configuration
        run: |
          set -euo pipefail
          echo "=== OPLUS/TOUCHPANEL entries in oplus.config ==="
          grep -E '^(CONFIG_OPLUS_|CONFIG_TOUCHPANEL_)' arch/arm64/configs/vendor/oplus.config || true
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config
          make ARCH=arm64 O=out olddefconfig
          echo "=== Effective OPLUS/TOUCHPANEL settings after olddefconfig ==="
          grep -E '^(CONFIG_OPLUS_|CONFIG_TOUCHPANEL_)' out/.config || true
          echo "=== SukiSU Ultra configuration ==="
          grep -Fqx 'CONFIG_KSU=y' out/.config
          grep -Fqx '# CONFIG_KSU_SUSFS is not set' out/.config
          grep -Fqx 'CONFIG_KPM=y' out/.config || { echo "ERROR: KPM did not resolve to y"; exit 1; }
          grep -Fqx 'CONFIG_KALLSYMS=y' out/.config || { echo "ERROR: KALLSYMS did not resolve to y"; exit 1; }
          grep -Fqx 'CONFIG_KALLSYMS_ALL=y' out/.config || { echo "ERROR: KALLSYMS_ALL did not resolve to y"; exit 1; }
          grep -E '^(CONFIG_KSU=|# CONFIG_KSU_SUSFS is not set)' out/.config

      - name: Enable built-in Qualcomm WLAN driver
        run: |
          set -euo pipefail
          scripts/config --file out/.config -e QCA_CLD_WLAN
          make ARCH=arm64 O=out olddefconfig
          echo "=== Qualcomm WLAN built-in configuration ==="
          grep -E '^(CONFIG_(STAGING|QCA_CLD_WLAN))=' out/.config || true
          grep -Fqx "CONFIG_QCA_CLD_WLAN=y" out/.config || { echo "ERROR: QCA_CLD_WLAN did not resolve to y"; exit 1; }

      - name: Compile Image.gz-dtb
        run: |
          set -euo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc \
            Image.gz-dtb

      - name: Verify built-in Qualcomm WLAN driver
        run: |
          set -euo pipefail
          echo "=== Final WLAN configuration ==="
          grep -Fqx "CONFIG_QCA_CLD_WLAN=y" out/.config || { echo "ERROR: WLAN is not built in"; exit 1; }
          WLAN_DIR="out/drivers/staging/qcacld-3.0"
          test -s "$WLAN_DIR/built-in.a" || { echo "ERROR: qcacld-3.0/built-in.a missing"; find "$WLAN_DIR" -maxdepth 2 -type f -print | head -80; exit 1; }
          test -s "$WLAN_DIR/wlan.o" || { echo "ERROR: qcacld-3.0/wlan.o missing"; exit 1; }
          echo "Built-in WLAN archive and linked driver object:"
          ls -lh "$WLAN_DIR/built-in.a" "$WLAN_DIR/wlan.o"
          echo "WLAN driver is linked into the kernel build; no wlan.ko is required."

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-dtb-${{ github.sha }}
          path: out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14

      - name: Package AnyKernel3 flashable ZIP
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cat > anykernel/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Plain DerpFest 17 for OnePlus 7T
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=hotdogb
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          (
            cd anykernel
            zip -r9 "$GITHUB_WORKSPACE/hotdogb-derpfest-17-base-test.zip" . -x '.git/*' 'README.md' '*placeholder'
          )
          unzip -l "$GITHUB_WORKSPACE/hotdogb-derpfest-17-base-test.zip"
          test -s "$GITHUB_WORKSPACE/hotdogb-derpfest-17-base-test.zip"
