name: Check SUSFS 4.14 patch compatibility

on:
  push:
    branches:
      - ksu-susfs
    paths:
      - '.github/workflows/check-susfs-4.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-susfs-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download pinned SUSFS 4.14 backport
        run: |
          set -euo pipefail
          curl -fL \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/26f2313be61f7a8603a50b2dcd12171495a79d27/Patches/Patch/susfs_patch_to_4.14.patch \
            -o /tmp/susfs-4.14.patch
          sha256sum /tmp/susfs-4.14.patch

      - name: Remove hunks already ported for this kernel fork
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("/tmp/susfs-4.14.patch").read_text()
          chunks = re.split(r'(?=^diff --git )', patch, flags=re.M)
          kept = []
          for chunk in chunks:
              if not chunk.startswith("diff --git "):
                  if chunk.strip():
                      kept.append(chunk)
                  continue
              path = chunk.split(" b/", 1)[1].splitlines()[0]
              if path == "fs/proc/cmdline.c":
                  continue
              parts = re.split(r'(?=^@@ )', chunk, flags=re.M)
              output = [parts[0]]
              for hunk in parts[1:]:
                  if path == "fs/namei.c" and "static int do_o_path" in hunk:
                      continue
                  if path == "kernel/kallsyms.c" and "#include <asm/sections.h>" in hunk:
                      continue
                  if path == "mm/memory.c" and "#define CREATE_TRACE_POINTS" in hunk:
                      continue
                  output.append(hunk)
              if len(output) > 1:
                  kept.append("".join(output))
          Path("/tmp/susfs-remaining.patch").write_text("".join(kept))
          PY

      - name: Check remaining patch applicability without modifying the checkout
        run: |
          set -euo pipefail
          git apply --check --verbose /tmp/susfs-remaining.patch

      - name: Apply SUSFS 4.14 backport and commit
        run: |
          set -euo pipefail
          git apply --verbose /tmp/susfs-remaining.patch
          git add -A
          if git diff --cached --quiet; then
            echo "No SUSFS changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fs: apply SUSFS 4.14 backport"
          git push origin "HEAD:ksu-susfs"
