name: Import KernelSU-Next

on:
  push:
    branches:
      - ksu-susfs
    paths:
      - '.github/workflows/import-kernelsu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-kernelsu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check out KernelSU-Next reference
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_kernel_oneplus_sm8150
          ref: 16.0-ksun
          path: ksu-source
          sparse-checkout: drivers/kernelsu
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Import KernelSU and wire build configuration
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          rm -rf drivers/kernelsu
          mkdir -p drivers
          cp -a ksu-source/drivers/kernelsu drivers/kernelsu

          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path, entry, marker, label):
              p = Path(path)
              data = p.read_text()
              if entry in data:
                  return
              if marker not in data:
                  raise SystemExit(f"{label}: insertion marker not found: {marker}")
              p.write_text(data.replace(marker, entry + "\n" + marker, 1))

          insert_once(
              "drivers/Kconfig",
              'source "drivers/kernelsu/Kconfig"',
              "endmenu",
              "drivers/Kconfig",
          )

          p = Path("drivers/Makefile")
          data = p.read_text()
          entry = "obj-$(CONFIG_KSU) += kernelsu/"
          if entry not in data:
              p.write_text(data.rstrip() + "\n" + entry + "\n")

          config_entries = [
              "CONFIG_KSU=y",
              "CONFIG_KPROBES=y",
              "CONFIG_KRETPROBES=y",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",

              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_MAP=y",
          ]
          p = Path("arch/arm64/configs/vendor/sm8150-perf_defconfig")
          data = p.read_text()
          missing = [entry for entry in config_entries if entry not in data]
          if missing:
              marker = "CONFIG_MODULES=y"
              if marker not in data:
                  raise SystemExit("sm8150-perf_defconfig: insertion marker not found")
              p.write_text(data.replace(marker, "\n".join(missing) + "\n" + marker, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/kernelsu drivers/Kconfig drivers/Makefile arch/arm64/configs/vendor/sm8150-perf_defconfig

          if git diff --cached --quiet; then
            echo "KernelSU import already matches this branch; no commit needed."
            exit 0
          fi

          git commit -m "drivers: import KernelSU-Next"
          git push origin "HEAD:${BRANCH_NAME}"
