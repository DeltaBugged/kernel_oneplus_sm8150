name: Build KernelSU SUSFS kernel
# Re-run against the latest KernelSU-Next import on ksu-susfs.

on:
  push:
    branches:
      - ksu-susfs
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'BUILDING.md'
      - 'drivers/**'
      - 'fs/**'
      - 'include/linux/**'
      - 'kernel/**'
      - 'mm/**'
      - 'arch/arm64/**'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install build dependencies and cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential cpio curl libssl-dev libelf-dev python3 zip clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi device-tree-compiler

      - name: Link LLVM 14 tool names expected by this kernel
        run: |
          set -euo pipefail
          for tool in ar nm objcopy objdump strip; do
            ln -sf "$(command -v llvm-${tool}-14)" "/usr/local/bin/llvm-${tool}"
          done

      - name: Generate kernel configuration
        run: |
          set -euo pipefail
          make ARCH=arm64 O=out vendor/sm8150-perf_defconfig
          for option in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KPROBES CONFIG_KSU_MANUAL_HOOK; do
            grep -qx "$option=y" out/.config || { echo "Missing or disabled: $option"; exit 1; }
          done
          ! grep -qx "CONFIG_KSU_KPROBES_HOOK=y" out/.config || { echo "KSU must use manual hooks on this 4.14 kernel"; exit 1; }
          grep -qx "# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set" out/.config || { echo "Unported SUSFS try_umount must remain disabled"; exit 1; }
          for option in CONFIG_OPLUS_DEVICE_IFNO CONFIG_OPLUS_FINGERPRINT CONFIG_TOUCHPANEL_OPLUS CONFIG_OPLUS_SM8150R_CHARGER; do
            grep -qx "$option=y" out/.config || { echo "Missing or disabled provider config: $option"; grep -E '^(CONFIG_(OPLUS|TOUCHPANEL)|# CONFIG_(OPLUS|TOUCHPANEL))' out/.config || true; exit 1; }
          done

      - name: Compile Image.gz-dtb
        run: |
          set -euo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc \
            Image.gz-dtb

      - name: Diagnose failed device-tree overlay
        if: failure()
        run: |
          set +e
          echo "=== DTC version ==="
          out/scripts/dtc/dtc -v
          echo "=== Generated overlay files ==="
          find out/arch/arm64/boot/dts/18821 -maxdepth 1 -type f -print | grep -E 'mtp-overlay|\.cmd' || true
          echo "=== Generated overlay source: first 80 lines ==="
          sed -n '1,80p' out/arch/arm64/boot/dts/18821/.sm8150-mtp-overlay.dtbo.dts.tmp
          echo "=== Plugin and first PMIC fragment ==="
          grep -n -E '^/dts-v1/|^/plugin/|^&spmi_bus|^# [0-9]+' out/arch/arm64/boot/dts/18821/.sm8150-mtp-overlay.dtbo.dts.tmp | head -50
          echo "=== DTC command ==="
          grep -R -n 'sm8150-mtp-overlay' out/arch/arm64/boot/dts/18821 out/arch/arm64/boot/dts 2>/dev/null | head -20
          echo "=== Direct DTC reproduction ==="
          out/scripts/dtc/dtc -I dts -O dtb -o /tmp/overlay-test.dtbo -@ out/arch/arm64/boot/dts/18821/.sm8150-mtp-overlay.dtbo.dts.tmp
          echo "=== End diagnostics ==="
          echo "=== DTC command records ==="
          find out/arch/arm64/boot/dts/18821 -maxdepth 1 -type f -name '*.cmd' -print | grep 'mtp-overlay' | while read f; do
            echo "--- $f"
            cat "$f"
          done
          echo "=== Direct preprocessing ==="
          clang-14 -E -nostdinc -I scripts/dtc/include-prefixes -undef -D__DTS__ -x assembler-with-cpp arch/arm64/boot/dts/18821/sm8150-mtp-overlay.dts -o /tmp/sm8150-mtp-overlay.preprocessed
          grep -n -B 8 -A 12 'spmi_bus' /tmp/sm8150-mtp-overlay.preprocessed | head -100
          echo "=== End diagnostics ==="

      - name: Verify kernel image
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb out/vmlinux

      - name: Package build artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz-dtb dist/
          cp out/vmlinux out/System.map dist/
          cp out/.config dist/kernel.config
          tar -czf hotdogb-kernelsu-susfs-${{ github.sha }}.tar.gz -C dist .

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-susfs-${{ github.sha }}
          path: hotdogb-kernelsu-susfs-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build AnyKernel3 flashable ZIP
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cat > anykernel/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=DeltaBugged KernelSU-SUSFS for OnePlus 7T
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=hotdogb
          device.name2=OnePlus7T
          device.name3=OnePlus 7T
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          (
            cd anykernel
            zip -r9 "$GITHUB_WORKSPACE/dist/hotdogb-kernelsu-susfs-${GITHUB_SHA}.zip" . -x '.git/*' 'README.md' '*placeholder'
          )
          unzip -l "dist/hotdogb-kernelsu-susfs-${GITHUB_SHA}.zip"
          test -s "dist/hotdogb-kernelsu-susfs-${GITHUB_SHA}.zip"

      - name: Upload flashable AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-susfs-flashable-${{ github.sha }}
          path: dist/hotdogb-kernelsu-susfs-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
