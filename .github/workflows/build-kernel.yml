name: Build KernelSU SUSFS kernel
# Re-run against the latest KernelSU-Next import on ksu-susfs.

on:
  push:
    branches:
      - ksu-susfs
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'BUILDING.md'
      - 'drivers/**'
      - 'fs/**'
      - 'include/linux/**'
      - 'kernel/**'
      - 'mm/**'
      - 'arch/arm64/**'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install build dependencies and cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential cpio curl libssl-dev libelf-dev python3 zip clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Link LLVM 14 tool names expected by this kernel
        run: |
          set -euo pipefail
          for tool in ar nm objcopy objdump strip; do
            ln -sf "$(command -v llvm-${tool}-14)" "/usr/local/bin/llvm-${tool}"
          done

      - name: Generate kernel configuration
        run: |
          set -euo pipefail
          make ARCH=arm64 O=out vendor/sm8150-perf_defconfig
          for option in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KPROBES CONFIG_KSU_MANUAL_HOOK; do
            grep -qx "$option=y" out/.config || { echo "Missing or disabled: $option"; exit 1; }
          done
          ! grep -qx "CONFIG_KSU_KPROBES_HOOK=y" out/.config || { echo "KSU must use manual hooks on this 4.14 kernel"; exit 1; }
          grep -qx "# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set" out/.config || { echo "Unported SUSFS try_umount must remain disabled"; exit 1; }

      - name: Compile Image.gz-dtb
        run: |
          set -euo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb

      - name: Diagnose failed device-tree overlay
        if: failure()
        run: |
          set +e
          echo "=== DTC version ==="
          out/scripts/dtc/dtc -v
          echo "=== Overlay-related generated files ==="
          find out/arch/arm64/boot/dts/18821 -maxdepth 1 -type f \\
            \( -iname '*mtp-overlay*' -o -iname '*.cmd' \) -print
          echo "=== Preprocessed overlay around PMIC fragment ==="
          find out/arch/arm64/boot/dts/18821 -maxdepth 1 -type f \\
            \( -name '*mtp-overlay*.tmp' -o -name '.*mtp-overlay*.tmp' \) \\
            -print -exec sh -c 'grep -n -B 8 -A 12 "spmi_bus" "$1" | head -80' _ {} \\
            \;
          echo "=== Recorded DTC command ==="
          find out/arch/arm64/boot/dts/18821 -maxdepth 1 -type f -name '.*mtp-overlay*.cmd' \\
            -print -exec cat {} \\
            \;

      - name: Verify kernel image
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb out/vmlinux

      - name: Package build artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz-dtb dist/
          cp out/vmlinux out/System.map dist/
          cp out/.config dist/kernel.config
          tar -czf hotdogb-kernelsu-susfs-${{ github.sha }}.tar.gz -C dist .

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-susfs-${{ github.sha }}
          path: hotdogb-kernelsu-susfs-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
