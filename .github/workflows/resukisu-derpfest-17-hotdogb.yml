name: Delta Kernel - DerpFest 17 hotdogb build
run-name: "Delta Kernel hotdogb / ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches:
      - bakasu-susfs

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out DerpFest 17 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install build dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential cpio curl libssl-dev libelf-dev python3 zip clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi device-tree-compiler

      - name: Link LLVM 14 tool names expected by this kernel
        run: |
          set -euo pipefail
          for tool in ar nm objcopy objdump strip; do
            ln -sf "$(command -v llvm-${tool}-14)" "/usr/local/bin/llvm-${tool}"
          done

      - name: Integrate pinned BakaSU source
        run: |
          set -euo pipefail
          BAKASU_COMMIT=57b2db6076f439cfd489f14576444e8f0f2f0a25
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" -o /tmp/bakasu-setup.sh
          bash /tmp/bakasu-setup.sh "${BAKASU_COMMIT}"
          test "$(git -C KernelSU rev-parse HEAD)" = "${BAKASU_COMMIT}"
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -Fq 'config KSU_MANUAL_HOOK' KernelSU/kernel/Kconfig
          grep -Fq 'config KSU_MANUAL_HOOK_AUTO_SETUID_HOOK' KernelSU/kernel/Kconfig
          grep -Fq 'config KSU_MANUAL_HOOK_AUTO_INITRC_HOOK' KernelSU/kernel/Kconfig
          grep -Fq 'config KSU_MANUAL_HOOK_AUTO_INPUT_HOOK' KernelSU/kernel/Kconfig
          echo "BakaSU pinned commit: ${BAKASU_COMMIT}"
          echo "BakaSU pinned commit: ${BAKASU_COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply SUSFS v2.4.0 Linux 4.14 patch and inline hooks
        run: |
          set -euo pipefail
          echo "=== Apply the pinned in-repository SUSFS 4.14 patch ==="
          python3 - <<'PY'
          from pathlib import Path
          source = Path("patches/susfs-4.14.patch").read_text()
          sections = source.split("diff --git ")[1:]
          kept = []
          for section in sections:
              if section.startswith("a/fs/proc/cmdline.c "):
                  continue
              kept.append("diff --git " + section)
          Path("/tmp/susfs-filtered.patch").write_text("".join(kept))
          PY
          patch --batch --forward --dry-run -p1 < /tmp/susfs-filtered.patch
          patch --batch --forward -p1 < /tmp/susfs-filtered.patch

          # BakaSU puts KSU_SUSFS inside a choice with MANUAL_HOOK. Move it
          # outside so SUSFS and manual hooks can be enabled simultaneously.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("KernelSU/kernel/Kconfig")
          s = p.read_text()
          start = s.index("config KSU_SUSFS\n")
          end = s.index("endchoice", start)
          block = s[start:end].rstrip()
          s = s[:start] + s[end:]
          pos = s.index("endchoice") + len("endchoice")
          s = s[:pos] + "\n\n" + block + s[pos:]
          if s.index("config KSU_SUSFS") < s.index("endchoice"):
              raise SystemExit("KSU_SUSFS remains inside the hook choice")
          if s.count("config KSU_SUSFS\n") != 1:
              raise SystemExit("Expected exactly one KSU_SUSFS Kconfig entry")
          p.write_text(s)
          PY

          # This 4.14 tree has a cmdline function that differs from the
          # upstream patch hunk; install the equivalent spoof path explicitly.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("fs/proc/cmdline.c")
          s = p.read_text()
          old = '''static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          \tseq_printf(m, "%s\\n", proc_command_line);
          \treturn 0;
          }'''
          new = '''#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;
          extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
          #endif

          static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          \tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {
          \t\tsusfs_spoof_cmdline_or_bootconfig(m);
          \t\tseq_putc(m, '\n');
          \t\treturn 0;
          \t}
          #endif
          \tseq_printf(m, "%s\\n", proc_command_line);
          \treturn 0;
          }'''
          if s.count(old) != 1:
              raise SystemExit("Could not uniquely match fs/proc/cmdline.c function")
          p.write_text(s.replace(old, new, 1))
          PY

          # The 4.14 KSTAT hunk needs SUSFS definitions, not linux/stat.h.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("fs/stat.c")
          s = p.read_text()
          inc = """#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          #include <linux/susfs_def.h>
          #endif
          """
          if "include <linux/susfs_def.h>" not in s:
              anchor = "#include <asm/unistd.h>\n"
              if s.count(anchor) != 1:
                  raise SystemExit("Could not find unique fs/stat.c include insertion point")
              s = s.replace(anchor, anchor + "\n" + inc, 1)
          for token in ("susfs_is_current_app_uid", "STATX_SUS_KSTAT", "STATX_SUS_KSTAT_FUSE"):
              if token not in s:
                  raise SystemExit(f"fs/stat.c missing expected KSTAT token: {token}")
          p.write_text(s)
          PY

          echo "=== Install BakaSU-compatible inline hooks ==="
          bash patches/susfs-inline-hooks.sh
          for spec in \
            "fs/exec.c:ksu_handle_execveat" \
            "fs/open.c:ksu_handle_faccessat" \
            "fs/stat.c:ksu_handle_stat" \
            "fs/stat.c:ksu_handle_vfs_fstat" \
            "fs/read_write.c:ksu_handle_sys_read(fd, &buf, &count)" \
            "drivers/input/input.c:ksu_handle_input_handle_event" \
            "kernel/reboot.c:ksu_handle_sys_reboot" \
            "kernel/sys.c:ksu_handle_setresuid" \
            "security/security.c:ksu_handle_setuid"; do
            IFS=: read -r file symbol <<< "$spec"
            grep -Fq "$symbol" "$file" || { echo "ERROR: missing hook $symbol in $file"; exit 1; }
          done
          grep -Fq '#define SUSFS_VERSION "v2.4.0"' include/linux/susfs.h
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

          # Preserve the narrow seccomp exception needed for BakaSU's reboot
          # supercall. Only the KSU magic request bypasses the Android filter.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kernel/seccomp.c")
          s = p.read_text()
          include = "#include <linux/sysctl.h>"
          if "#include <asm/unistd.h>" not in s:
              if s.count(include) != 1:
                  raise SystemExit("Could not find unique seccomp include anchor")
              s = s.replace(include, include + "\n#include <asm/unistd.h>", 1)
          anchor = """\tthis_syscall = sd ? sd->nr :
          \t\tsyscall_get_nr(current, task_pt_regs(current));

          \tswitch (mode) {"""
          replacement = """\tthis_syscall = sd ? sd->nr :
          \t\tsyscall_get_nr(current, task_pt_regs(current));

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \t/*
          \t * Android app seccomp filters commonly deny reboot(2). BakaSU
          \t * obtains its driver fd through this exact reboot supercall.
          \t * Ordinary reboot requests remain subject to the original filter.
          \t */
          \tif (mode == SECCOMP_MODE_FILTER && this_syscall == __NR_reboot) {
          \t\tunsigned long args[6];

          \t\tif (sd) {
          \t\t\targs[0] = sd->args[0];
          \t\t\targs[1] = sd->args[1];
          \t\t\targs[2] = sd->args[2];
          \t\t} else {
          \t\t\tsyscall_get_arguments(current, task_pt_regs(current), 0, 6, args);
          \t\t}

          \t\tif ((u32)args[0] == 0xDEADBEEF &&
          \t\t    (u32)args[1] == 0xCAFEBABE &&
          \t\t    (u32)args[2] == 0)
          \t\t\treturn 0;
          \t}
          #endif

          \tswitch (mode) {"""
          if s.count(anchor) != 1:
              raise SystemExit("Could not uniquely match seccomp syscall dispatch")
          s = s.replace(anchor, replacement, 1)
          for token in ("0xDEADBEEF", "0xCAFEBABE",
                        "mode == SECCOMP_MODE_FILTER && this_syscall == __NR_reboot"):
              if token not in s:
                  raise SystemExit(f"Missing BakaSU seccomp exception: {token}")
          p.write_text(s)
          PY
          git diff --check
          echo "SUSFS v2.4.0 and BakaSU hook integration source checks passed."
          echo "SUSFS v2.4.0 + BakaSU inline hooks" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate kernel configuration
        run: |
          set -euo pipefail
          make ARCH=arm64 O=out vendor/sm8150-perf_defconfig

      - name: Merge OPlus configuration
        run: |
          set -euo pipefail
          echo "=== OPLUS/TOUCHPANEL entries in oplus.config ==="
          grep -E '^(CONFIG_OPLUS_|CONFIG_TOUCHPANEL_)' arch/arm64/configs/vendor/oplus.config || true
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config
          scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_PRIORITY_UID_FILTER -e THREAD_INFO_IN_TASK -e KALLSYMS -e KALLSYMS_ALL -d KSU_TRACEPOINT_HOOK
          make ARCH=arm64 O=out olddefconfig
          echo "=== Effective OPLUS/TOUCHPANEL settings after olddefconfig ==="
          grep -E '^(CONFIG_OPLUS_|CONFIG_TOUCHPANEL_)' out/.config || true
          echo "=== BakaSU Linux 4.14 hook configuration ==="
          grep -Fqx 'CONFIG_KSU=y' out/.config || { echo "ERROR: KSU is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config || { echo "ERROR: manual hook mode is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' out/.config || { echo "ERROR: automatic LSM setuid hook is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' out/.config || { echo "ERROR: automatic init.rc hook is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' out/.config || { echo "ERROR: automatic input hook is not enabled"; exit 1; }
          grep -Fqx '# CONFIG_KSU_TRACEPOINT_HOOK is not set' out/.config || { echo "ERROR: tracepoint hook must be disabled on Linux 4.14"; exit 1; }
          grep -Fqx 'CONFIG_KSU_SUSFS=y' out/.config || { echo "ERROR: SUSFS is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config || { echo "ERROR: SUS_PATH is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config || { echo "ERROR: SUS_MOUNT is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' out/.config || { echo "ERROR: SUS_KSTAT is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' out/.config || { echo "ERROR: cmdline spoofing is not enabled"; exit 1; }
          grep -Fqx 'CONFIG_KALLSYMS=y' out/.config || { echo "ERROR: KALLSYMS did not resolve to y"; exit 1; }
          grep -Fqx 'CONFIG_KALLSYMS_ALL=y' out/.config || { echo "ERROR: KALLSYMS_ALL did not resolve to y"; exit 1; }
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_|CONFIG_KSU_SUSFS=|# CONFIG_KSU_TRACEPOINT_HOOK is not set|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=)' out/.config

      - name: Enable built-in Qualcomm WLAN driver
        run: |
          set -euo pipefail
          scripts/config --file out/.config -e QCA_CLD_WLAN
          make ARCH=arm64 O=out olddefconfig
          echo "=== Qualcomm WLAN built-in configuration ==="
          grep -E '^(CONFIG_(STAGING|QCA_CLD_WLAN))=' out/.config || true
          grep -Fqx "CONFIG_QCA_CLD_WLAN=y" out/.config || { echo "ERROR: QCA_CLD_WLAN did not resolve to y"; exit 1; }

      - name: Set deterministic clean kernel version
        run: |
          set -euo pipefail
          # scripts/setlocalversion trusts .scmversion when present and skips
          # git status, preventing workflow-applied source patches from adding -dirty.
          printf '%s' "-g${GITHUB_SHA:0:12}" > .scmversion
          echo "Kernel SCM suffix: $(cat .scmversion)"
          test "$(cat .scmversion)" = "-g${GITHUB_SHA:0:12}"

      - name: Compile Image.gz-dtb
        run: |
          set -euo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc \
            Image.gz-dtb

      - name: Verify linked BakaSU, SUSFS and Qualcomm WLAN
        run: |
          set -euo pipefail
          grep -Fqx "CONFIG_QCA_CLD_WLAN=y" out/.config || { echo "ERROR: WLAN is not built in"; exit 1; }
          grep -Fqx "CONFIG_KSU=y" out/.config || { echo "ERROR: BakaSU is not enabled"; exit 1; }
          grep -Fqx "CONFIG_KSU_SUSFS=y" out/.config || { echo "ERROR: SUSFS is not enabled"; exit 1; }
          test -s out/drivers/kernelsu/built-in.a || { echo "ERROR: BakaSU built-in archive missing"; find out/drivers/kernelsu -maxdepth 3 -type f -print | head -80; exit 1; }
          test -s out/fs/susfs.o || { echo "ERROR: fs/susfs.o was not built"; exit 1; }
          grep -Fq '#define SUSFS_VERSION "v2.4.0"' include/linux/susfs.h || { echo "ERROR: SUSFS version mismatch"; exit 1; }
          test -s out/drivers/staging/qcacld-3.0/built-in.a || { echo "ERROR: qcacld-3.0/built-in.a missing"; exit 1; }
          test -s out/drivers/staging/qcacld-3.0/wlan.o || { echo "ERROR: qcacld-3.0/wlan.o missing"; exit 1; }
          echo "BakaSU, SUSFS and Qualcomm WLAN built-in objects verified."
          ls -lh out/drivers/kernelsu/built-in.a out/fs/susfs.o out/drivers/staging/qcacld-3.0/built-in.a out/drivers/staging/qcacld-3.0/wlan.o

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Kernel-Image-gz-dtb-${{ github.sha }}
          path: out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14

      - name: Package AnyKernel3 flashable ZIP
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image.gz-dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cat > anykernel/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Delta Kernel | DerpFest 17 | OnePlus 7T
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          (
            cd anykernel
            zip -r9 "$GITHUB_WORKSPACE/Delta-Kernel-hotdogb-derpfest-17.zip" . -x '.git/*' 'README.md' '*placeholder'
          )
          unzip -t "$GITHUB_WORKSPACE/Delta-Kernel-hotdogb-derpfest-17.zip"
          test -s "$GITHUB_WORKSPACE/Delta-Kernel-hotdogb-derpfest-17.zip"

      - name: Upload AnyKernel3 flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Kernel-AnyKernel3-hotdogb-${{ github.sha }}
          path: Delta-Kernel-hotdogb-derpfest-17.zip
          if-no-files-found: error
          retention-days: 14
