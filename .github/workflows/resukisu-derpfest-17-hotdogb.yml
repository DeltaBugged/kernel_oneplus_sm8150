          grep -Fqx "CONFIG_KSU=y" out/.config || { echo "ERROR: ReSukiSU is not enabled"; exit 1; }
          test -s out/drivers/kernelsu/built-in.a || { echo "ERROR: ReSukiSU built-in archive missing"; find out/drivers/kernelsu -maxdepth 3 -type f -print | head -80; exit 1; }
          test -s out/drivers/staging/qcacld-3.0/built-in.a || { echo "ERROR: qcacld-3.0/built-in.a missing"; exit 1; }
          test -s out/drivers/staging/qcacld-3.0/wlan.o || { echo "ERROR: qcacld-3.0/wlan.o missing"; exit 1; }
          echo "ReSukiSU and Qualcomm WLAN built-in archives verified."
          ls -lh out/drivers/kernelsu/built-in.a out/drivers/staging/qcacld-3.0/built-in.a out/drivers/staging/qcacld-3.0/wlan.o

